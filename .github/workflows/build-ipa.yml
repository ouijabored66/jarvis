# Builds an unsigned Lumen Voice IPA (iPhone app + embedded Apple Watch app).
# Sideload LumenVoice-1.6-unsigned.ipa with LiveContainer or SideStore and a free Apple ID.
name: Build iOS app

on:
  push:
    branches: [main, watch-companion, lumen-voice]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"
  pull_request:
    branches: [watch-companion]
    paths:
      - "ios/**"
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      PROJECT: ios/LumenVoice.xcodeproj
      SCHEME: LumenVoice

    steps:
      - uses: actions/checkout@v4

      - name: Xcode and SDKs
        run: |
          xcodebuild -version
          if ! xcodebuild -showsdks | grep -q watchos; then
            echo "watchOS SDK missing; downloading the platform"
            xcodebuild -downloadPlatform watchOS
          fi
          xcodebuild -showsdks | grep -E 'iphoneos|watchos'

      - name: Reply path tests
        run: |
          set -euo pipefail
          swiftc -O -o "$RUNNER_TEMP/relay-tests" ios/Relay/RelayReply.swift ios/RelayTests/main.swift
          "$RUNNER_TEMP/relay-tests"

      - name: Archive (unsigned)
        run: |
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LumenVoice.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            MARKETING_VERSION=1.6 CURRENT_PROJECT_VERSION=4 \
            archive > "$RUNNER_TEMP/archive.log" 2>&1 \
            || { grep -E 'error:|BUILD FAILED|ARCHIVE FAILED' "$RUNNER_TEMP/archive.log" | head -50; tail -80 "$RUNNER_TEMP/archive.log"; exit 1; }
          grep -E 'warning:' "$RUNNER_TEMP/archive.log" | sort -u | head -30 || true
          tail -3 "$RUNNER_TEMP/archive.log"

      - name: Package unsigned IPA
        run: |
          APP="$RUNNER_TEMP/LumenVoice.xcarchive/Products/Applications/LumenVoice.app"
          WATCH="$APP/Watch/LumenVoiceWatch.app"
          test -d "$APP" || { echo "::error::LumenVoice.app not found in the archive"; ls -R "$RUNNER_TEMP/LumenVoice.xcarchive/Products"; exit 1; }
          test -d "$WATCH" || { echo "::error::The Watch app was not embedded in LumenVoice.app/Watch"; ls -la "$APP"; exit 1; }
          phone_name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$APP/Info.plist")
          phone_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          phone_ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist")
          phone_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist")
          watch_name=$(/usr/libexec/PlistBuddy -c 'Print CFBundleDisplayName' "$WATCH/Info.plist")
          watch_id=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$WATCH/Info.plist")
          watch_companion=$(/usr/libexec/PlistBuddy -c 'Print WKCompanionAppBundleIdentifier' "$WATCH/Info.plist")
          watch_ver=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$WATCH/Info.plist")
          watch_build=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$WATCH/Info.plist")
          echo "phone: $phone_name $phone_id $phone_ver ($phone_build)"
          echo "watch: $watch_name $watch_id $watch_ver ($watch_build) companion=$watch_companion"
          test "$phone_name" = "Lumen Voice" && test "$watch_name" = "Lumen Voice" || { echo "::error::Display name is not Lumen Voice"; exit 1; }
          test "$phone_id" = "ouijabored66.lumenvoice" || { echo "::error::Unexpected phone bundle id $phone_id"; exit 1; }
          test "$watch_id" = "ouijabored66.lumenvoice.watchkitapp" || { echo "::error::Unexpected watch bundle id $watch_id"; exit 1; }
          test "$watch_companion" = "ouijabored66.lumenvoice" || { echo "::error::WKCompanionAppBundleIdentifier is $watch_companion"; exit 1; }
          test "$phone_ver" = "1.6" && test "$phone_build" = "4" || { echo "::error::Expected version 1.6 (4), got $phone_ver ($phone_build)"; exit 1; }
          test "$watch_ver" = "1.6" && test "$watch_build" = "4" || { echo "::error::Watch version is $watch_ver ($watch_build)"; exit 1; }
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "LumenVoice-1.6-unsigned.ipa" Payload)
          unzip -l "$RUNNER_TEMP/ipa/LumenVoice-1.6-unsigned.ipa" | grep -q 'Payload/LumenVoice.app/Watch/LumenVoiceWatch.app/' \
            || { echo "::error::IPA is missing the Watch app"; unzip -l "$RUNNER_TEMP/ipa/LumenVoice-1.6-unsigned.ipa" | head -40; exit 1; }
          ls -lh "$RUNNER_TEMP/ipa"/*.ipa
          {
            echo "### Unsigned IPA 1.6 (4)"
            echo "Download **LumenVoice-1.6-unsigned.ipa**. Install [LiveContainer](https://github.com/LiveContainer/LiveContainer) with [SideStore](https://sidestore.io) and a free Apple ID, then import this unsigned IPA into LiveContainer. A free Apple ID allows only a few App IDs, so LiveContainer keeps Lumen Voice inside the one you already installed."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unsigned IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LumenVoice-1.6-unsigned.ipa
          path: ${{ runner.temp }}/ipa/LumenVoice-1.6-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
