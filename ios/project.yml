# XcodeGen spec for the App Store build of Lumen (iPhone app).
# LumenVoice.xcodeproj is generated from this file and committed; after editing, regenerate with
#   xcodegen generate --spec ios/project.yml
# The xtool/SwiftPM build in LumenApp/ still works for sideloading.
name: LumenVoice
options:
  bundleIdPrefix: com.ouijabored66
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.4"
    CURRENT_PROJECT_VERSION: "5"     # CI overrides this with a unique number for every upload
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is passed by CI (APPLE_TEAM_ID); set it in Xcode if you build locally.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  LumenVoice:
    type: application
    platform: iOS
    sources:
      - path: LumenApp/Sources/LumenApp
      - path: Shared/Assets.xcassets
      - path: Shared/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: LumenVoice
        PRODUCT_BUNDLE_IDENTIFIER: com.ouijabored66.lumenvoice
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Xcode/LumenVoice-Info.plist
      properties:
        CFBundleDisplayName: Lumen
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Lumen records your voice only while you hold the microphone button (or after you say "Lumen"),
          and sends that recording to the Lumen server you set up so it can answer you.
        NSSpeechRecognitionUsageDescription: >-
          Lumen uses on-device speech recognition to listen for the word "Lumen" for hands-free use,
          and in Demo Mode to show what you said. This speech is processed on your iPhone and is not sent anywhere.
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

schemes:
  LumenVoice:
    build:
      targets:
        LumenVoice: all
    archive:
      config: Release
