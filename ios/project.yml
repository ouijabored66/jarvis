# XcodeGen spec for the App Store build of Lumen Voice (iPhone app + Apple Watch companion).
# JarvisVoice.xcodeproj is generated from this file and committed; after editing, regenerate with
#   xcodegen generate --spec ios/project.yml
# The xtool/SwiftPM build in JarvisApp/ still works for sideloading.
name: JarvisVoice
options:
  bundleIdPrefix: com.dylanpreed
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.5"
    CURRENT_PROJECT_VERSION: "1.2"   # signed CI uploads override this with a unique number
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    # DEVELOPMENT_TEAM is passed by CI (APPLE_TEAM_ID); set it in Xcode if you build locally.
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

targets:
  JarvisVoice:
    type: application
    platform: iOS
    sources:
      - path: JarvisApp/Sources/JarvisApp
      - path: Shared/Assets.xcassets
      - path: Shared/PrivacyInfo.xcprivacy
    dependencies:
      - target: JarvisVoiceWatch     # embedded in JarvisVoice.app/Watch/
    settings:
      base:
        PRODUCT_NAME: JarvisVoice
        PRODUCT_BUNDLE_IDENTIFIER: com.dylanpreed.jarvisvoice
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Xcode/JarvisVoice-Info.plist
      properties:
        CFBundleDisplayName: Lumen Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Lumen listens on this iPhone, after you say "Lumen" or hold the microphone, and turns that into text on the device.
        NSSpeechRecognitionUsageDescription: >-
          Lumen uses on-device speech recognition to hear "Lumen" and to turn what you say into text. This stays on your iPhone when on-device recognition is available.
        NSLocalNetworkUsageDescription: >-
          Lumen connects to your own server on the local network when you choose Run your own server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            local:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
            ts.net:
              NSIncludesSubdomains: true
              NSExceptionAllowsInsecureHTTPLoads: true
        CFBundleURLTypes:
          - CFBundleURLName: com.dylanpreed.jarvisvoice
            CFBundleURLSchemes:
              - lumenvoice
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait

  JarvisVoiceWatch:
    type: application
    platform: watchOS
    sources:
      - path: JarvisWatch
      - path: JarvisApp/Sources/JarvisApp/ServerID.swift
      - path: JarvisApp/Sources/JarvisApp/Keychain.swift
      - path: JarvisApp/Sources/JarvisApp/DemoBrain.swift
      - path: Shared/Assets.xcassets
      - path: Shared/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_NAME: JarvisVoiceWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.dylanpreed.jarvisvoice.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES             # ships inside the iPhone app, not as a separate archive product
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Xcode/JarvisVoiceWatch-Info.plist
      properties:
        CFBundleDisplayName: Lumen Voice
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: >-
          Lumen listens on this Watch only long enough to turn your question into text, then sends that text to the iPhone app.
        NSSpeechRecognitionUsageDescription: >-
          Lumen turns what you say into text on this Watch. The recording is not sent to a speech service.
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.dylanpreed.jarvisvoice
        WKRunsIndependentlyOfCompanionApp: false

schemes:
  JarvisVoice:
    build:
      targets:
        JarvisVoice: all
    archive:
      config: Release
